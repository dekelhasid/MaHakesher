<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f1e8">
<title>ניהול מה הקשר</title>
<style>
:root{--paper:#f4f1e8;--ink:#171717;--card:#fff;--line:#d8d2c5;--yellow:#f2df68;--green:#a8d78c;--blue:#88c9e8;--purple:#b69ad9;--red:#b92f2f}
*{box-sizing:border-box}body{font-family:Arial,"Noto Sans Hebrew",sans-serif;background:var(--paper);margin:0;color:var(--ink)}
.wrap{max-width:880px;margin:auto;padding:18px 12px calc(36px + env(safe-area-inset-bottom))}h1{text-align:center;font-family:Georgia,serif;font-size:42px;margin:8px 0 18px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:17px;margin:12px 0;box-shadow:0 3px 0 #0001}.group-card{border-top:10px solid}.group-card:nth-child(1){border-top-color:var(--yellow)}.group-card:nth-child(2){border-top-color:var(--green)}.group-card:nth-child(3){border-top-color:var(--blue)}.group-card:nth-child(4){border-top-color:var(--purple)}
label{display:block;font-weight:800;margin:10px 0 5px}input{width:100%;padding:12px;border:1.5px solid #bbb5aa;border-radius:8px;font-size:16px;background:#fff}.words{display:grid;grid-template-columns:1fr 1fr;gap:9px}.actions{position:sticky;bottom:8px;z-index:3;display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin:18px 0;background:#f4f1e8e8;padding:9px;border-radius:999px;backdrop-filter:blur(7px)}button{padding:12px 19px;border:1.5px solid var(--ink);border-radius:999px;font-size:16px;font-weight:800;cursor:pointer;background:var(--ink);color:#fff}.secondary{background:#fff;color:var(--ink)}.danger{background:#fff;color:var(--red);border-color:var(--red)}.status{text-align:center;min-height:30px;font-weight:800;font-size:16px}.note{font-size:14px;color:#5b574f;line-height:1.5}.token-row{display:grid;grid-template-columns:1fr auto;gap:8px;direction:ltr}.token{direction:ltr;text-align:left}.small{font-size:13px;color:#666}.saved-badge{display:inline-block;padding:4px 9px;border-radius:999px;background:#dcf0d8;color:#275e27;font-size:13px;font-weight:800;margin-right:6px}.preview-link{text-align:center;margin-top:-5px}.preview-link a{color:inherit;font-weight:800}
@media(max-width:600px){.words{grid-template-columns:1fr}.actions{border-radius:18px}.token-row{grid-template-columns:1fr}h1{font-size:36px}}
</style></head>
<body><main class="wrap"><h1>ניהול החידה</h1><div class="preview-link"><a href="./" target="_blank">פתח את המשחק בחלון חדש</a></div>
<div class="card"><div class="note">הטוקן נשמר רק בדפדפן במכשיר הזה. לאחר ההזנה הראשונה אין צורך להקליד אותו שוב.</div><label>GitHub token <span id="savedBadge"></span></label><div class="token-row"><input id="token" class="token" type="password" autocomplete="off" placeholder="github_pat_..."><button id="toggleToken" class="secondary" type="button">הצג</button></div><div class="small">הטוקן צריך הרשאת Contents: Read and write רק לריפו MaHakesher.</div></div>
<div class="card"><label>כותרת</label><input id="title"><label>כותרת משנה</label><input id="subtitle"><label>מספר ניסיונות</label><input id="maxAttempts" type="number" min="1" max="20"></div>
<div id="groups"></div>
<div class="card"><h2>רמז</h2><div class="words"><input id="hint1" placeholder="מילה ראשונה"><input id="hint2" placeholder="מילה שנייה"></div><div class="small">שתי המילים חייבות להופיע בלוח.</div></div>
<div class="actions"><button id="load" class="secondary">בטל שינויים וטען מחדש</button><button id="save">שמור ופרסם</button><button id="forget" class="danger">שכח טוקן</button></div><div id="status" class="status"></div></main>
<script>
const OWNER='dekelhasid',REPO='MaHakesher',PATH='game-data.json',BRANCH='main';let currentSha='',dirty=false;
const $=id=>document.getElementById(id),status=$('status');
function setStatus(t,bad=false){status.textContent=t;status.style.color=bad?'#a00':'#176b28'}
function buildGroups(){const host=$('groups');host.innerHTML='';for(let i=0;i<4;i++){const c=document.createElement('div');c.className='card group-card';c.innerHTML=`<h2>קבוצה ${i+1}</h2><label>שם הקבוצה</label><input id="g${i}title"><label>ארבע המילים</label><div class="words">${[0,1,2,3].map(j=>`<input id="g${i}w${j}" placeholder="מילה ${j+1}">`).join('')}</div>`;host.appendChild(c)}}
function utf8ToBase64(str){const bytes=new TextEncoder().encode(str);let bin='';bytes.forEach(b=>bin+=String.fromCharCode(b));return btoa(bin)}
function base64ToUtf8(str){const bin=atob(str.replace(/\n/g,''));const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));return new TextDecoder().decode(bytes)}
function updateTokenBadge(){const has=!!localStorage.getItem('ghToken');$('savedBadge').textContent=has?'נשמר במכשיר':'';$('savedBadge').className=has?'saved-badge':''}
async function loadData(){setStatus('טוען...');try{const r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}?ref=${BRANCH}&t=${Date.now()}`,{headers:{Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}});if(!r.ok)throw new Error('טעינה נכשלה ('+r.status+')');const f=await r.json();currentSha=f.sha;const d=JSON.parse(base64ToUtf8(f.content));$('title').value=d.title||'';$('subtitle').value=d.subtitle||'';$('maxAttempts').value=d.maxAttempts||6;d.groups.forEach((g,i)=>{if(i<4){$(`g${i}title`).value=g.title||'';g.words.forEach((w,j)=>{$(`g${i}w${j}`).value=w||''})}});$('hint1').value=d.hintWords?.[0]||'';$('hint2').value=d.hintWords?.[1]||'';dirty=false;setStatus('הנתונים נטענו.')}catch(e){setStatus(e.message,true)}}
function collect(){const groups=[];for(let i=0;i<4;i++)groups.push({title:$(`g${i}title`).value.trim(),words:[0,1,2,3].map(j=>$(`g${i}w${j}`).value.trim())});const d={title:$('title').value.trim(),subtitle:$('subtitle').value.trim(),maxAttempts:Number($('maxAttempts').value)||6,groups,hintWords:[$('hint1').value.trim(),$('hint2').value.trim()]};const all=groups.flatMap(g=>g.words);if(groups.some(g=>!g.title||g.words.some(w=>!w)))throw new Error('צריך למלא שם וארבע מילים בכל קבוצה.');if(new Set(all).size!==16)throw new Error('כל 16 המילים צריכות להיות שונות.');if(d.hintWords.some(w=>!all.includes(w)))throw new Error('מילות הרמז חייבות להופיע בלוח.');return d}
async function saveData(){try{const token=$('token').value.trim();if(!token)throw new Error('חסר GitHub token.');localStorage.setItem('ghToken',token);updateTokenBadge();const d=collect();setStatus('שומר ומפרסם...');const body={message:'Update puzzle from admin page',content:utf8ToBase64(JSON.stringify(d,null,2)+'\n'),sha:currentSha,branch:BRANCH};const r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`,{method:'PUT',headers:{Authorization:`Bearer ${token}`,Accept:'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},body:JSON.stringify(body)});if(!r.ok){const x=await r.json().catch(()=>({}));throw new Error(x.message||'שמירה נכשלה ('+r.status+')')}const x=await r.json();currentSha=x.content.sha;dirty=false;setStatus('נשמר בהצלחה. המשחק יתעדכן בדרך כלל בתוך כמה שניות.')}catch(e){setStatus(e.message,true)}}
buildGroups();$('token').value=localStorage.getItem('ghToken')||'';updateTokenBadge();
document.querySelectorAll('input').forEach(el=>el.addEventListener('input',()=>{dirty=true;setStatus('יש שינויים שעדיין לא נשמרו.')}));
$('load').onclick=()=>{if(!dirty||confirm('לבטל את השינויים שלא נשמרו?'))loadData()};$('save').onclick=saveData;
$('toggleToken').onclick=()=>{const show=$('token').type==='password';$('token').type=show?'text':'password';$('toggleToken').textContent=show?'הסתר':'הצג'};
$('forget').onclick=()=>{localStorage.removeItem('ghToken');$('token').value='';updateTokenBadge();setStatus('הטוקן נמחק מהמכשיר.')};
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});loadData();
</script></body></html>
