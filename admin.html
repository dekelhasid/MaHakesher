<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ניהול מה הקשר</title><style>
body{font-family:Arial,sans-serif;background:#f6f7f9;margin:0;color:#222}.wrap{max-width:850px;margin:auto;padding:20px}h1{text-align:center}.card{background:white;border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 2px 10px #0001}label{display:block;font-weight:700;margin:10px 0 5px}input{width:100%;padding:12px;border:1px solid #ccc;border-radius:9px;font-size:16px} .words{display:grid;grid-template-columns:1fr 1fr;gap:9px}.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:20px 0}button{padding:13px 22px;border:0;border-radius:999px;font-size:17px;cursor:pointer;background:#222;color:#fff}.secondary{background:#ddd;color:#222}.status{text-align:center;min-height:28px;font-weight:700}.note{font-size:14px;color:#555;line-height:1.5}.token{direction:ltr;text-align:left}@media(max-width:600px){.words{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><h1>ניהול החידה</h1>
<div class="card"><div class="note">העמוד שומר את הנתונים בקובץ <b>game-data.json</b> בריפו. כדי לשמור, הזן GitHub Fine-grained token עם הרשאת <b>Contents: Read and write</b> לריפו MaHakesher. הטוקן נשמר בדפדפן במכשיר הזה, כך שאין צורך להזין אותו בכל פעם. אין להשתמש במכשיר ציבורי.</div><label>GitHub token</label><input id="token" class="token" type="password" autocomplete="off" placeholder="github_pat_..."></div>
<div class="card"><label>כותרת</label><input id="title"><label>כותרת משנה</label><input id="subtitle"><label>מספר ניסיונות</label><input id="maxAttempts" type="number" min="1" max="20"></div>
<div id="groups"></div>
<div class="card"><h2>רמז</h2><div class="words"><input id="hint1" placeholder="מילה ראשונה"><input id="hint2" placeholder="מילה שנייה"></div></div>
<div class="actions"><button id="load" class="secondary">טען מחדש</button><button id="save">שמור ופרסם</button></div><div id="status" class="status"></div></main>
<script>
const OWNER='dekelhasid',REPO='MaHakesher',PATH='game-data.json',BRANCH='main';let currentSha='';const $=id=>document.getElementById(id),status=$('status');
function setStatus(t,bad=false){status.textContent=t;status.style.color=bad?'#a00':'#176b28'}
function buildGroups(){const host=$('groups');host.innerHTML='';for(let i=0;i<4;i++){const c=document.createElement('div');c.className='card';c.innerHTML=`<h2>קבוצה ${i+1}</h2><label>שם הקבוצה</label><input id="g${i}title"><label>ארבע המילים</label><div class="words">${[0,1,2,3].map(j=>`<input id="g${i}w${j}" placeholder="מילה ${j+1}">`).join('')}</div>`;host.appendChild(c)}}
function utf8ToBase64(str){const bytes=new TextEncoder().encode(str);let bin='';bytes.forEach(b=>bin+=String.fromCharCode(b));return btoa(bin)}
function base64ToUtf8(str){const bin=atob(str.replace(/\n/g,''));const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));return new TextDecoder().decode(bytes)}
async function loadData(){setStatus('טוען...');try{const r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}?ref=${BRANCH}&t=${Date.now()}`,{headers:{Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}});if(!r.ok)throw new Error('טעינה נכשלה ('+r.status+')');const f=await r.json();currentSha=f.sha;const d=JSON.parse(base64ToUtf8(f.content));$('title').value=d.title||'';$('subtitle').value=d.subtitle||'';$('maxAttempts').value=d.maxAttempts||6;d.groups.forEach((g,i)=>{if(i<4){$(`g${i}title`).value=g.title||'';g.words.forEach((w,j)=>{$(`g${i}w${j}`).value=w||''})}});$('hint1').value=d.hintWords?.[0]||'';$('hint2').value=d.hintWords?.[1]||'';setStatus('הנתונים נטענו.')}catch(e){setStatus(e.message,true)}}
function collect(){const groups=[];for(let i=0;i<4;i++){groups.push({title:$(`g${i}title`).value.trim(),words:[0,1,2,3].map(j=>$(`g${i}w${j}`).value.trim())})}const d={title:$('title').value.trim(),subtitle:$('subtitle').value.trim(),maxAttempts:Number($('maxAttempts').value)||6,groups,hintWords:[$('hint1').value.trim(),$('hint2').value.trim()]};const all=groups.flatMap(g=>g.words);if(groups.some(g=>!g.title||g.words.some(w=>!w)))throw new Error('צריך למלא שם וארבע מילים בכל קבוצה.');if(new Set(all).size!==16)throw new Error('כל 16 המילים צריכות להיות שונות.');if(d.hintWords.some(w=>!all.includes(w)))throw new Error('מילות הרמז חייבות להופיע בלוח.');return d}
async function saveData(){try{const token=$('token').value.trim();if(!token)throw new Error('חסר GitHub token.');localStorage.setItem('ghToken',token);const d=collect();setStatus('שומר...');const body={message:'Update puzzle from admin page',content:utf8ToBase64(JSON.stringify(d,null,2)+'\n'),sha:currentSha,branch:BRANCH};const r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`,{method:'PUT',headers:{Authorization:`Bearer ${token}`,Accept:'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},body:JSON.stringify(body)});if(!r.ok){const x=await r.json().catch(()=>({}));throw new Error(x.message||'שמירה נכשלה ('+r.status+')')}const x=await r.json();currentSha=x.content.sha;setStatus('נשמר בהצלחה. המשחק יתעדכן בתוך כדקה.')}catch(e){setStatus(e.message,true)}}
buildGroups();$('token').value=localStorage.getItem('ghToken')||'';$('load').onclick=loadData;$('save').onclick=saveData;loadData();
</script></body></html>
