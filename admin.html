<!DOCTYPE html>
<html lang="he" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f1e8"><title>ניהול מה הקשר</title>
<style>
:root{--paper:#f4f1e8;--ink:#171717;--card:#fff;--line:#d8d2c5;--redsoft:#e39a9a;--green:#a8d78c;--blue:#88c9e8;--purple:#b69ad9;--red:#b92f2f;--draft:#896400}*{box-sizing:border-box}body{font-family:Arial,"Noto Sans Hebrew",sans-serif;background:var(--paper);margin:0;color:var(--ink)}.wrap{max-width:960px;margin:auto;padding:18px 12px 50px}h1{text-align:center;font-family:Georgia,serif;font-size:42px;margin:8px 0}.toplink{text-align:center;margin-bottom:18px}.toplink a{color:inherit;font-weight:800}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:17px;margin:12px 0;box-shadow:0 3px 0 #0001}.group-card{border-top:10px solid}.group-card:nth-child(1){border-top-color:var(--redsoft)}.group-card:nth-child(2){border-top-color:var(--green)}.group-card:nth-child(3){border-top-color:var(--blue)}.group-card:nth-child(4){border-top-color:var(--purple)}label{display:block;font-weight:800;margin:10px 0 5px}input{width:100%;padding:12px;border:1.5px solid #bbb5aa;border-radius:8px;font-size:16px;background:#fff}.words{display:grid;grid-template-columns:1fr 1fr;gap:9px}.actions{position:sticky;bottom:8px;z-index:3;display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin:18px 0;background:#f4f1e8e8;padding:9px;border-radius:999px;backdrop-filter:blur(7px)}button{padding:10px 16px;border:1.5px solid var(--ink);border-radius:999px;font-size:15px;font-weight:800;cursor:pointer;background:var(--ink);color:#fff}.secondary{background:#fff;color:var(--ink)}.draft{background:#fff7cf;color:var(--draft);border-color:#b58a00}.status{text-align:center;min-height:30px;font-weight:800}.note{font-size:14px;color:#5b574f;line-height:1.5}.stats-list,.players-list{display:grid;gap:12px}.stats-card,.player-card{border:1px solid var(--line);border-radius:10px;padding:14px}.stats-card h3,.player-card h3{margin:0 0 10px}.stat-row{display:grid;grid-template-columns:1fr auto;gap:10px;padding:4px 0}.stat-row b{direction:ltr}.badge{display:inline-block;padding:4px 9px;border-radius:999px;font-size:13px;font-weight:800;background:#fff0ae;color:#725400;margin-right:6px}.small{font-size:13px;color:#666}.player-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:8px 0 12px}.metric{background:#f7f5ef;border-radius:8px;padding:8px;text-align:center}.metric b{display:block;font-size:20px}.player-actions{display:flex;gap:8px;flex-wrap:wrap}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.show{display:flex}.dialog{width:min(700px,100%);max-height:85vh;overflow:auto;background:var(--paper);border:2px solid var(--ink);border-radius:14px;padding:20px}.history-table{width:100%;border-collapse:collapse}.history-table th,.history-table td{padding:9px;border-bottom:1px solid var(--line);text-align:right}.missing{display:flex;flex-wrap:wrap;gap:8px}.missing a{background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 11px;color:inherit;text-decoration:none}.close{float:left}@media(max-width:600px){.words{grid-template-columns:1fr}.actions{border-radius:18px}h1{font-size:36px}.player-grid{grid-template-columns:1fr 1fr}.history-table{font-size:13px}}
</style></head>
<body><main class="wrap"><h1>ניהול החידה</h1><div class="toplink"><a href="./" target="_blank">פתח את המשחק</a></div>
<div class="card"><div class="note">״שמור טיוטה״ שומר ב־Firebase אך לא משנה את המשחק שכולם רואים. ״פרסם״ הופך את הטיוטה לחידה הנוכחית ושומר את הקודמת בארכיון.</div></div>
<div class="card"><label>כותרת <span id="draftBadge"></span></label><input id="title"><label>כותרת משנה</label><input id="subtitle"><label>מספר ניסיונות</label><input id="maxAttempts" type="number" min="1" max="20"></div>
<div id="groups"></div><div class="card"><h2>רמז</h2><div class="words"><input id="hint1" placeholder="מילה ראשונה"><input id="hint2" placeholder="מילה שנייה"></div><div class="small">שתי המילים חייבות להופיע בלוח.</div></div>
<div class="actions"><button id="loadPublished" class="secondary">טען מפורסם</button><button id="saveDraft" class="draft">שמור טיוטה</button><button id="publish">פרסם משחק חדש</button></div><div id="status" class="status"></div>
<section class="card"><h2>סטטיסטיקות חידות</h2><div id="statsList" class="stats-list"><div class="small">טוען...</div></div></section>
<section class="card"><h2>שחקנים ורצפים</h2><div id="playersList" class="players-list"><div class="small">טוען...</div></div></section>
</main>
<div id="historyModal" class="modal"><div class="dialog"><button id="closeHistory" class="secondary close">סגור</button><h2 id="historyTitle"></h2><div id="historyBody"></div></div></div>
<div id="renameModal" class="modal"><div class="dialog"><button id="closeRename" class="secondary close">סגור</button><h2>שינוי שם</h2><input id="renameInput"><div class="player-actions" style="margin-top:12px"><button id="saveRename">שמור</button></div><div id="renameStatus" class="status"></div></div></div>
<script>
const FIREBASE_URL='https://mahakesher-ada29-default-rtdb.europe-west1.firebasedatabase.app';let currentId=null,currentPuzzle=null,dirty=false,allPuzzles={},renamePlayerId=null;const $=id=>document.getElementById(id),status=$('status');
function setStatus(t,bad=false){status.textContent=t;status.style.color=bad?'#a00':'#176b28'}
async function dbGet(path){const r=await fetch(`${FIREBASE_URL}/${path}.json?ts=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw new Error('טעינה נכשלה');return r.json()}
async function dbPut(path,data){const r=await fetch(`${FIREBASE_URL}/${path}.json`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(!r.ok)throw new Error('שמירה נכשלה');return r.json()}
async function dbPatch(path,data){const r=await fetch(`${FIREBASE_URL}/${path}.json`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(!r.ok)throw new Error('שמירה נכשלה');return r.json()}
function normalizeName(name){return name.trim().replace(/\s+/g,' ').toLocaleLowerCase('he')}function nameKey(name){const bytes=new TextEncoder().encode(normalizeName(name));let s='';bytes.forEach(b=>s+=String.fromCharCode(b));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function buildGroups(){const host=$('groups');for(let i=0;i<4;i++){const c=document.createElement('div');c.className='card group-card';c.innerHTML=`<h2>קבוצה ${i+1}</h2><label>שם הקבוצה</label><input id="g${i}title"><label>ארבע המילים</label><div class="words">${[0,1,2,3].map(j=>`<input id="g${i}w${j}" placeholder="מילה ${j+1}">`).join('')}</div>`;host.appendChild(c)}}
function fill(d){$('title').value=d?.title||'מה הקשר?';$('subtitle').value=d?.subtitle||'חברו ארבע קבוצות של ארבע';$('maxAttempts').value=d?.maxAttempts||6;for(let i=0;i<4;i++){const g=d?.groups?.[i]||{};$(`g${i}title`).value=g.title||'';for(let j=0;j<4;j++)$(`g${i}w${j}`).value=g.words?.[j]||''}$('hint1').value=d?.hintWords?.[0]||'';$('hint2').value=d?.hintWords?.[1]||'';dirty=false}
function collect(){const groups=[];for(let i=0;i<4;i++)groups.push({title:$(`g${i}title`).value.trim(),words:[0,1,2,3].map(j=>$(`g${i}w${j}`).value.trim())});const d={title:$('title').value.trim(),subtitle:$('subtitle').value.trim(),maxAttempts:Number($('maxAttempts').value)||6,groups,hintWords:[$('hint1').value.trim(),$('hint2').value.trim()]};const all=groups.flatMap(g=>g.words);if(groups.some(g=>!g.title||g.words.some(w=>!w)))throw new Error('צריך למלא שם וארבע מילים בכל קבוצה.');if(new Set(all).size!==16)throw new Error('כל 16 המילים צריכות להיות שונות.');if(d.hintWords.some(w=>!all.includes(w)))throw new Error('מילות הרמז חייבות להופיע בלוח.');return d}
async function loadPublished(){setStatus('טוען...');try{currentId=await dbGet('currentId');let d=currentId?await dbGet(`puzzles/${currentId}`):null;if(!d){const r=await fetch(`game-data.json?ts=${Date.now()}`,{cache:'no-store'});if(r.ok)d=await r.json()}currentPuzzle=d;fill(d);$('draftBadge').textContent='';setStatus('המשחק המפורסם נטען.')}catch(e){setStatus(e.message,true)}}
async function loadDraftOrPublished(){try{const draft=await dbGet('drafts/main');if(draft){fill(draft);$('draftBadge').textContent='טיוטה שמורה';$('draftBadge').className='badge';setStatus('נטענה הטיוטה השמורה.')}else await loadPublished()}catch(e){setStatus(e.message,true)}}
async function saveDraft(){try{const d=collect();d.savedAt=new Date().toISOString();await dbPut('drafts/main',d);dirty=false;$('draftBadge').textContent='טיוטה שמורה';$('draftBadge').className='badge';setStatus('הטיוטה נשמרה. המשחק הציבורי לא השתנה.')}catch(e){setStatus(e.message,true)}}
async function publish(){try{const d=collect();setStatus('מפרסם...');const seq=Number(await dbGet('sequence'))||0;const nextNumber=seq+1;const id=`game-${Date.now()}`;const published={...d,id,number:nextNumber,published:true,publishedAt:new Date().toISOString()};await dbPatch('',{[`puzzles/${id}`]:published,currentId:id,sequence:nextNumber,'drafts/main':null});currentId=id;currentPuzzle=published;dirty=false;$('draftBadge').textContent='';setStatus(`חידה #${nextNumber} פורסמה בהצלחה.`);await refreshAll()}catch(e){setStatus(e.message,true)}}
function pct(n,total){return total?Math.round((Number(n||0)/total)*100):0}
async function loadStats(){try{const [puzzlesRaw,stats]=await Promise.all([dbGet('puzzles'),dbGet('stats')]);allPuzzles=puzzlesRaw||{};const list=Object.values(allPuzzles).filter(p=>p?.published).sort((a,b)=>(b.number||0)-(a.number||0));$('statsList').innerHTML=list.length?list.map(p=>{const s=stats?.[p.id]||{},solved=s.solved||{},solvedTotal=Object.values(solved).reduce((a,b)=>a+Number(b||0),0),failed=Number(s.failed)||0,total=solvedTotal+failed;let rows='';for(let i=0;i<(p.maxAttempts||6);i++){const label=i===0?'פתרו ללא טעויות':i===1?'פתרו עם טעות אחת':`פתרו עם ${i} טעויות`;rows+=`<div class="stat-row"><span>${label}</span><b>${pct(solved[i],total)}%</b></div>`}rows+=`<div class="stat-row"><span>לא הצליחו</span><b>${pct(failed,total)}%</b></div>`;return `<div class="stats-card"><h3>חידה #${p.number||''}${p.id===currentId?' — נוכחית':''}</h3><div class="stat-row"><span>סה״כ סיימו</span><b>${total}</b></div>${rows}</div>`}).join(''):'<div class="small">עדיין אין חידות מפורסמות ב־Firebase.</div>'}catch(e){$('statsList').textContent='לא ניתן לטעון סטטיסטיקות.'}}
async function loadPlayers(){try{const [players,results,puzzles]=await Promise.all([dbGet('players'),dbGet('playerResults'),dbGet('puzzles')]);allPuzzles=puzzles||{};const entries=Object.entries(players||{}).sort((a,b)=>(Number(b[1].currentStreak)||0)-(Number(a[1].currentStreak)||0));$('playersList').innerHTML=entries.length?entries.map(([id,p])=>`<div class="player-card"><h3>${p.name||'ללא שם'}</h3><div class="player-grid"><div class="metric"><b>${Number(p.currentStreak)||0}</b>רצף</div><div class="metric"><b>${Number(p.bestStreak)||0}</b>שיא</div><div class="metric"><b>${Number(p.played)||0}</b>שיחק</div><div class="metric"><b>${Number(p.solved)||0}</b>פתר</div><div class="metric"><b>${p.played?Math.round((Number(p.solved)||0)/(Number(p.played)||1)*100):0}%</b>הצלחה</div></div><div class="player-actions"><button class="secondary" onclick="openRename('${id}')">שינוי שם</button><button onclick="openHistory('${id}')">צפייה בהיסטוריה</button></div></div>`).join(''):'<div class="small">עדיין אין שחקנים רשומים.</div>';window._players=players||{};window._results=results||{}}catch(e){$('playersList').textContent='לא ניתן לטעון שחקנים.'}}
window.openHistory=function(id){const p=window._players[id],results=window._results[id]||{},puzzles=Object.values(allPuzzles).filter(x=>x?.published).sort((a,b)=>(b.number||0)-(a.number||0));$('historyTitle').textContent=`היסטוריה — ${p.name}`;const rows=puzzles.filter(x=>results[x.id]).map(x=>{const r=results[x.id];const text=r.won?(Number(r.mistakes)===0?'פתר ללא טעויות':Number(r.mistakes)===1?'פתר עם טעות אחת':`פתר עם ${r.mistakes} טעויות`):'לא פתר';return `<tr><td>#${x.number||''}</td><td>${text}</td></tr>`}).join('');const missing=puzzles.filter(x=>!results[x.id]);$('historyBody').innerHTML=`<table class="history-table"><thead><tr><th>חידה</th><th>תוצאה</th></tr></thead><tbody>${rows||'<tr><td colspan="2">עדיין לא שיחק.</td></tr>'}</tbody></table><h3>חידות שלא שיחק</h3><div class="missing">${missing.length?missing.map(x=>`<a target="_blank" href="./?game=${encodeURIComponent(x.id)}">#${x.number||''}</a>`).join(''):'אין — הוא שיחק בכולן.'}</div>`;$('historyModal').classList.add('show')}
window.openRename=function(id){renamePlayerId=id;$('renameInput').value=window._players[id].name||'';$('renameStatus').textContent='';$('renameModal').classList.add('show')}
async function saveRename(){const name=$('renameInput').value.trim().replace(/\s+/g,' '),p=window._players[renamePlayerId];if(!name)return $('renameStatus').textContent='צריך להכניס שם.';const oldKey=nameKey(p.name),newKey=nameKey(name),existing=await dbGet(`playerNames/${newKey}`).catch(()=>null);if(existing&&existing!==renamePlayerId)return $('renameStatus').textContent='השם כבר תפוס.';await dbPatch('',{[`players/${renamePlayerId}/name`]:name,[`playerNames/${newKey}`]:renamePlayerId,[`playerNames/${oldKey}`]:null});$('renameModal').classList.remove('show');await loadPlayers()}
async function refreshAll(){await Promise.all([loadStats(),loadPlayers()])}
buildGroups();document.querySelectorAll('input').forEach(el=>el.addEventListener('input',()=>{dirty=true;setStatus('יש שינויים שלא נשמרו.')}));$('loadPublished').onclick=()=>{if(!dirty||confirm('לבטל את השינויים שעל המסך?'))loadPublished()};$('saveDraft').onclick=saveDraft;$('publish').onclick=publish;$('closeHistory').onclick=()=>$('historyModal').classList.remove('show');$('closeRename').onclick=()=>$('renameModal').classList.remove('show');$('saveRename').onclick=()=>saveRename().catch(e=>$('renameStatus').textContent=e.message);window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});(async()=>{currentId=await dbGet('currentId').catch(()=>null);await loadDraftOrPublished();await refreshAll()})();
</script></body></html>
