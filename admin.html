<!DOCTYPE html>
<html lang="he" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f1e8"><title>ניהול מה הקשר</title>
<style>:root{--paper:#f4f1e8;--ink:#171717;--card:#fff;--line:#d8d2c5;--yellow:#f2df68;--green:#a8d78c;--blue:#88c9e8;--purple:#b69ad9;--red:#b92f2f;--draft:#896400}*{box-sizing:border-box}body{font-family:Arial,"Noto Sans Hebrew",sans-serif;background:var(--paper);margin:0;color:var(--ink)}.wrap{max-width:900px;margin:auto;padding:18px 12px 50px}h1{text-align:center;font-family:Georgia,serif;font-size:42px;margin:8px 0 8px}.toplink{text-align:center;margin-bottom:18px}.toplink a{color:inherit;font-weight:800}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:17px;margin:12px 0;box-shadow:0 3px 0 #0001}.group-card{border-top:10px solid}.group-card:nth-child(1){border-top-color:var(--yellow)}.group-card:nth-child(2){border-top-color:var(--green)}.group-card:nth-child(3){border-top-color:var(--blue)}.group-card:nth-child(4){border-top-color:var(--purple)}label{display:block;font-weight:800;margin:10px 0 5px}input{width:100%;padding:12px;border:1.5px solid #bbb5aa;border-radius:8px;font-size:16px;background:#fff}.words{display:grid;grid-template-columns:1fr 1fr;gap:9px}.actions{position:sticky;bottom:8px;z-index:3;display:flex;gap:9px;flex-wrap:wrap;justify-content:center;margin:18px 0;background:#f4f1e8e8;padding:9px;border-radius:999px;backdrop-filter:blur(7px)}button{padding:12px 19px;border:1.5px solid var(--ink);border-radius:999px;font-size:16px;font-weight:800;cursor:pointer;background:var(--ink);color:#fff}.secondary{background:#fff;color:var(--ink)}.draft{background:#fff7cf;color:var(--draft);border-color:#b58a00}.danger{background:#fff;color:var(--red);border-color:var(--red)}.status{text-align:center;min-height:30px;font-weight:800}.note{font-size:14px;color:#5b574f;line-height:1.5}.stats-list{display:grid;gap:12px}.stats-card{border:1px solid var(--line);border-radius:10px;padding:14px}.stats-card h3{margin:0 0 10px}.stat-row{display:grid;grid-template-columns:1fr auto;gap:10px;padding:4px 0}.stat-row b{direction:ltr}.badge{display:inline-block;padding:4px 9px;border-radius:999px;font-size:13px;font-weight:800;background:#fff0ae;color:#725400;margin-right:6px}.small{font-size:13px;color:#666}@media(max-width:600px){.words{grid-template-columns:1fr}.actions{border-radius:18px}h1{font-size:36px}}</style></head>
<body><main class="wrap"><h1>ניהול החידה</h1><div class="toplink"><a href="./" target="_blank">פתח את המשחק</a></div>
<div class="card"><div class="note">״שמור טיוטה״ שומר ב־Firebase אך לא משנה את המשחק שכולם רואים. ״פרסם״ הופך את הטיוטה לחידה הנוכחית ושומר את הקודמת בארכיון.</div></div>
<div class="card"><label>כותרת <span id="draftBadge"></span></label><input id="title"><label>כותרת משנה</label><input id="subtitle"><label>מספר ניסיונות</label><input id="maxAttempts" type="number" min="1" max="20"></div>
<div id="groups"></div>
<div class="card"><h2>רמז</h2><div class="words"><input id="hint1" placeholder="מילה ראשונה"><input id="hint2" placeholder="מילה שנייה"></div><div class="small">שתי המילים חייבות להופיע בלוח.</div></div>
<div class="actions"><button id="loadPublished" class="secondary">טען מפורסם</button><button id="saveDraft" class="draft">שמור טיוטה</button><button id="publish">פרסם משחק חדש</button></div><div id="status" class="status"></div>
<section class="card"><h2>סטטיסטיקות</h2><div id="statsList" class="stats-list"><div class="small">טוען...</div></div></section>
</main>
<script>
const FIREBASE_URL='https://mahakesher-ada29-default-rtdb.europe-west1.firebasedatabase.app';
let currentId=null,currentPuzzle=null,dirty=false;const $=id=>document.getElementById(id),status=$('status');
function setStatus(t,bad=false){status.textContent=t;status.style.color=bad?'#a00':'#176b28'}
async function dbGet(path){const r=await fetch(`${FIREBASE_URL}/${path}.json?ts=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw new Error('טעינה נכשלה');return r.json()}
async function dbPut(path,data){const r=await fetch(`${FIREBASE_URL}/${path}.json`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(!r.ok)throw new Error('שמירה נכשלה');return r.json()}
async function dbPatch(path,data){const r=await fetch(`${FIREBASE_URL}/${path}.json`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(!r.ok)throw new Error('שמירה נכשלה');return r.json()}
function buildGroups(){const host=$('groups');for(let i=0;i<4;i++){const c=document.createElement('div');c.className='card group-card';c.innerHTML=`<h2>קבוצה ${i+1}</h2><label>שם הקבוצה</label><input id="g${i}title"><label>ארבע המילים</label><div class="words">${[0,1,2,3].map(j=>`<input id="g${i}w${j}" placeholder="מילה ${j+1}">`).join('')}</div>`;host.appendChild(c)}}
function fill(d){$('title').value=d?.title||'מה הקשר?';$('subtitle').value=d?.subtitle||'חברו ארבע קבוצות של ארבע';$('maxAttempts').value=d?.maxAttempts||6;for(let i=0;i<4;i++){const g=d?.groups?.[i]||{};$(`g${i}title`).value=g.title||'';for(let j=0;j<4;j++)$(`g${i}w${j}`).value=g.words?.[j]||''}$('hint1').value=d?.hintWords?.[0]||'';$('hint2').value=d?.hintWords?.[1]||'';dirty=false}
function collect(){const groups=[];for(let i=0;i<4;i++)groups.push({title:$(`g${i}title`).value.trim(),words:[0,1,2,3].map(j=>$(`g${i}w${j}`).value.trim())});const d={title:$('title').value.trim(),subtitle:$('subtitle').value.trim(),maxAttempts:Number($('maxAttempts').value)||6,groups,hintWords:[$('hint1').value.trim(),$('hint2').value.trim()]};const all=groups.flatMap(g=>g.words);if(groups.some(g=>!g.title||g.words.some(w=>!w)))throw new Error('צריך למלא שם וארבע מילים בכל קבוצה.');if(new Set(all).size!==16)throw new Error('כל 16 המילים צריכות להיות שונות.');if(d.hintWords.some(w=>!all.includes(w)))throw new Error('מילות הרמז חייבות להופיע בלוח.');return d}
async function loadPublished(){setStatus('טוען...');try{currentId=await dbGet('currentId');let d=currentId?await dbGet(`puzzles/${currentId}`):null;if(!d){const r=await fetch(`game-data.json?ts=${Date.now()}`,{cache:'no-store'});if(r.ok)d=await r.json()}currentPuzzle=d;fill(d);$('draftBadge').textContent='';$('draftBadge').className='';setStatus('המשחק המפורסם נטען.')}catch(e){setStatus(e.message,true)}}
async function loadDraftOrPublished(){try{const draft=await dbGet('drafts/main');if(draft){fill(draft);$('draftBadge').textContent='טיוטה שמורה';$('draftBadge').className='badge';setStatus('נטענה הטיוטה השמורה.')}else await loadPublished()}catch(e){setStatus(e.message,true)}}
async function saveDraft(){try{const d=collect();d.savedAt=new Date().toISOString();await dbPut('drafts/main',d);dirty=false;$('draftBadge').textContent='טיוטה שמורה';$('draftBadge').className='badge';setStatus('הטיוטה נשמרה. המשחק הציבורי לא השתנה.')}catch(e){setStatus(e.message,true)}}
async function publish(){try{const d=collect();setStatus('מפרסם...');const seq=Number(await dbGet('sequence'))||0;const nextNumber=seq+1;const id=`game-${Date.now()}`;const published={...d,id,number:nextNumber,published:true,publishedAt:new Date().toISOString()};await dbPatch('',{[`puzzles/${id}`]:published,currentId:id,sequence:nextNumber,'drafts/main':null});currentId=id;currentPuzzle=published;dirty=false;$('draftBadge').textContent='';$('draftBadge').className='';setStatus(`חידה #${nextNumber} פורסמה בהצלחה.`);await loadStats()}catch(e){setStatus(e.message,true)}}
function pct(n,total){return total?Math.round((Number(n||0)/total)*100):0}
async function loadStats(){try{const [puzzlesRaw,stats]=await Promise.all([dbGet('puzzles'),dbGet('stats')]);const puzzleMap={...(puzzlesRaw||{})};if(currentPuzzle){const fallbackId=currentPuzzle.id||currentId||'legacy-current';if(!puzzleMap[fallbackId])puzzleMap[fallbackId]={...currentPuzzle,id:fallbackId,number:currentPuzzle.number||1,published:true}}Object.keys(stats||{}).forEach(id=>{if(!puzzleMap[id])puzzleMap[id]={id,number:id==='legacy-current'?1:'',maxAttempts:6,published:true}});const list=Object.values(puzzleMap).filter(p=>p?.published).sort((a,b)=>(b.number||0)-(a.number||0));$('statsList').innerHTML=list.length?list.map(p=>{const s=stats?.[p.id]||{},total=Number(s.started)||0;let rows='';for(let i=0;i<(p.maxAttempts||6);i++){const label=i===0?'פתרו ללא טעויות':i===1?'פתרו עם טעות אחת':`פתרו עם ${i} טעויות`;rows+=`<div class="stat-row"><span>${label}</span><b>${pct(s.solved?.[i],total)}%</b></div>`}rows+=`<div class="stat-row"><span>לא הצליחו</span><b>${pct(s.failed,total)}%</b></div>`;const isCurrent=p.id===currentId||(!currentId&&p.id==='legacy-current');return `<div class="stats-card"><h3>חידה #${p.number||''}${isCurrent?' — נוכחית':''}</h3><div class="stat-row"><span>סה״כ שיחקו</span><b>${total}</b></div>${rows}</div>`}).join(''):'<div class="small">עדיין אין נתוני משחקים ב־Firebase.</div>'}catch(e){$('statsList').textContent='לא ניתן לטעון סטטיסטיקות.'}}
buildGroups();document.querySelectorAll('input').forEach(el=>el.addEventListener('input',()=>{dirty=true;setStatus('יש שינויים שלא נשמרו.')}));$('loadPublished').onclick=()=>{if(!dirty||confirm('לבטל את השינויים שעל המסך?'))loadPublished()};$('saveDraft').onclick=saveDraft;$('publish').onclick=publish;window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});(async()=>{currentId=await dbGet('currentId').catch(()=>null);await loadDraftOrPublished();await loadStats()})();
</script></body></html>
