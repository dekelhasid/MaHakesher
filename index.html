<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>מה הקשר?</title>
  <style>
    :root{--bg:#fff;--tile:#f1f1f1;--sel:#c9daf6;--text:#242424;--border:#ddd;--success:#dcefd8;--danger:#f4d8d8;--button:#f3f3f3;--shadow:0 2px 8px rgba(0,0,0,.08)}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,"Noto Sans Hebrew",sans-serif;min-height:100vh}
    .app{width:min(920px,100%);margin:auto;padding:28px 18px 40px} h1{margin:0 0 10px;text-align:center;font-size:clamp(28px,5vw,46px)}
    .subtitle{text-align:center;color:#555;margin-bottom:28px;font-size:clamp(16px,2.5vw,22px)} .solved-groups{display:grid;gap:12px;margin-bottom:14px}
    .solved-card{border-radius:14px;padding:18px;text-align:center;background:var(--success);box-shadow:var(--shadow)} .solved-card strong{display:block;font-size:20px;margin-bottom:6px}.solved-card span{font-size:17px}
    .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.tile{min-height:124px;border:0;border-radius:12px;background:var(--tile);color:var(--text);font-size:clamp(18px,3vw,28px);font-weight:700;padding:12px;cursor:pointer;box-shadow:var(--shadow);word-break:break-word}.tile.selected{background:var(--sel)}.tile.hint{outline:4px solid #f0c84b}
    .message{min-height:44px;margin:16px auto 6px;text-align:center;font-size:18px;font-weight:700}.controls{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin-top:12px}.control{border:1px solid var(--border);background:var(--button);color:var(--text);border-radius:999px;padding:13px 20px;font-size:17px;cursor:pointer}.control:disabled{opacity:.4;cursor:not-allowed}
    .attempts{margin-top:28px;display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap;font-size:22px;font-weight:700}.dots{display:flex;gap:8px;direction:ltr}.dot{width:24px;height:24px;border:2px solid #222;border-radius:50%;background:#fff}.dot.used{background:#222}
    .end-panel{display:none;margin-top:22px;padding:22px;border-radius:14px;text-align:center;font-size:21px;font-weight:700;box-shadow:var(--shadow)}.end-panel.win{display:block;background:var(--success)}.end-panel.lose{display:block;background:var(--danger)}
    .loading{text-align:center;padding:50px;font-size:20px}.error{color:#a00;text-align:center;padding:30px}
    @media(max-width:650px){.app{padding:22px 10px 28px}.grid{gap:8px}.tile{min-height:98px;border-radius:9px;padding:8px 5px}.control{padding:11px 15px;font-size:15px}}
  </style>
</head>
<body>
<main class="app">
  <h1 id="title">מה הקשר?</h1><div id="subtitle" class="subtitle">טוען חידה...</div>
  <section id="solvedGroups" class="solved-groups"></section><section id="grid" class="grid"></section>
  <div id="message" class="message" aria-live="polite"></div>
  <div class="controls"><button id="hintBtn" class="control">רמז</button><button id="shuffleBtn" class="control">ערבוב</button><button id="clearBtn" class="control">ניקוי בחירה</button><button id="submitBtn" class="control" disabled>אישור</button></div>
  <div class="attempts"><span>ניסיונות:</span><div id="dots" class="dots"></div></div><div id="endPanel" class="end-panel"></div>
</main>
<script>
let data,groups,MAX_ATTEMPTS,hintWords,remainingWords=[],selected=[],solved=[],mistakes=0,gameOver=false,hintUsed=false;
const triedSelections=new Set();
const $=id=>document.getElementById(id), grid=$('grid'),solvedGroups=$('solvedGroups'),message=$('message'),dots=$('dots'),endPanel=$('endPanel'),hintBtn=$('hintBtn'),shuffleBtn=$('shuffleBtn'),clearBtn=$('clearBtn'),submitBtn=$('submitBtn');
function shuffleArray(a){const c=[...a];for(let i=c.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[c[i],c[j]]=[c[j],c[i]]}return c}
function selectionKey(words){return [...words].sort((a,b)=>a.localeCompare(b,'he')).join('\u0001')}
function render(){grid.innerHTML='';remainingWords.forEach(word=>{const b=document.createElement('button');b.className='tile';b.textContent=word;if(selected.includes(word))b.classList.add('selected');if(hintUsed&&hintWords.includes(word))b.classList.add('hint');b.onclick=()=>toggleWord(word);grid.appendChild(b)});solvedGroups.innerHTML='';solved.forEach(group=>{const c=document.createElement('div');c.className='solved-card';c.innerHTML=`<strong>${group.title}</strong><span>${group.words.join(' · ')}</span>`;solvedGroups.appendChild(c)});dots.innerHTML='';for(let i=0;i<MAX_ATTEMPTS;i++){const d=document.createElement('span');d.className='dot'+(i<mistakes?' used':'');dots.appendChild(d)}submitBtn.disabled=selected.length!==4||gameOver;clearBtn.disabled=!selected.length||gameOver;shuffleBtn.disabled=gameOver;hintBtn.disabled=hintUsed||gameOver}
function toggleWord(word){if(gameOver)return;if(selected.includes(word))selected=selected.filter(x=>x!==word);else if(selected.length<4)selected.push(word);message.textContent='';render()}
function submitSelection(){if(selected.length!==4||gameOver)return;const key=selectionKey(selected);if(triedSelections.has(key)){message.textContent='כבר ניסית את הרביעייה הזאת.';selected=[];render();return}triedSelections.add(key);const match=groups.find(g=>!solved.includes(g)&&g.words.every(w=>selected.includes(w)));if(match){solved.push(match);remainingWords=remainingWords.filter(w=>!match.words.includes(w));selected=[];message.textContent='נכון!';hintUsed=false;if(solved.length===groups.length)finishGame(true)}else{mistakes++;const close=groups.find(g=>!solved.includes(g)&&g.words.filter(w=>selected.includes(w)).length===3);message.textContent=close?'קרוב מאוד — חסרה מילה אחת.':'לא הקבוצה הנכונה.';selected=[];if(mistakes>=MAX_ATTEMPTS)finishGame(false)}render()}
function finishGame(won){gameOver=true;endPanel.className='end-panel '+(won?'win':'lose');endPanel.textContent=won?'כל הכבוד! מצאת את כל ארבע הקבוצות.':'נגמרו הניסיונות.';if(!won){groups.filter(g=>!solved.includes(g)).forEach(g=>solved.push(g));remainingWords=[]}}
hintBtn.onclick=()=>{hintUsed=true;selected=hintWords.filter(w=>remainingWords.includes(w));message.textContent='שתי המילים המסומנות שייכות לאותה קבוצה.';render()};shuffleBtn.onclick=()=>{remainingWords=shuffleArray(remainingWords);selected=[];message.textContent='';render()};clearBtn.onclick=()=>{selected=[];message.textContent='';render()};submitBtn.onclick=submitSelection;
async function start(){try{const r=await fetch('game-data.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('לא נמצא game-data.json');data=await r.json();groups=data.groups;MAX_ATTEMPTS=data.maxAttempts||6;hintWords=data.hintWords||[];$('title').textContent=data.title||'מה הקשר?';$('subtitle').textContent=data.subtitle||'חברו ארבע קבוצות של ארבע';remainingWords=shuffleArray(groups.flatMap(g=>g.words));render()}catch(e){$('subtitle').textContent='';grid.innerHTML=`<div class="error">שגיאה בטעינת החידה: ${e.message}</div>`}}
start();
</script>
</body></html>
