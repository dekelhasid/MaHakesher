<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fffdf8" />
  <title>מה הקשר?</title>
  <style>
    :root{
      --paper:#fffdf8;--ink:#171717;--muted:#6f6b64;--tile:#efeee9;--selected:#1f1f1f;
      --line:#d9d6ce;--yellow:#f2df68;--green:#a8d78c;--blue:#88c9e8;--purple:#b69ad9;
      --danger:#c94040;--shadow:0 3px 0 rgba(0,0,0,.12);--radius:8px
    }
    *{box-sizing:border-box}
    html{background:var(--paper)}
    body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);font-family:Arial,"Noto Sans Hebrew",sans-serif}
    button{font:inherit}
    .app{width:min(760px,100%);margin:auto;padding:22px 14px calc(34px + env(safe-area-inset-bottom))}
    .mast{text-align:center;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:20px}
    h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(38px,10vw,72px);letter-spacing:-2px;margin:0;line-height:.95}
    .subtitle{font-size:clamp(16px,3.7vw,21px);margin-top:12px;color:#34312d}
    .solved-groups{display:grid;gap:9px;margin-bottom:9px}
    .solved-card{min-height:92px;border-radius:var(--radius);padding:13px 10px;text-align:center;display:flex;flex-direction:column;justify-content:center;animation:solveIn .58s cubic-bezier(.2,.85,.25,1.25);box-shadow:var(--shadow)}
    .solved-card strong{font-size:clamp(16px,3.7vw,22px);margin-bottom:7px;line-height:1.15}
    .solved-card span{font-size:clamp(14px,3.3vw,18px);font-weight:700;line-height:1.35}
    .group-0{background:var(--yellow)}.group-1{background:var(--green)}.group-2{background:var(--blue)}.group-3{background:var(--purple)}
    .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;direction:rtl}
    .tile{aspect-ratio:1.24/1;min-height:82px;border:0;border-radius:var(--radius);background:var(--tile);color:var(--ink);font-size:clamp(15px,3.5vw,22px);font-weight:800;padding:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.08;overflow-wrap:anywhere;box-shadow:var(--shadow);transition:transform .14s ease,background .14s ease,color .14s ease,box-shadow .14s ease;touch-action:manipulation}
    .tile:active{transform:scale(.96)}
    .tile.selected{background:var(--selected);color:#fff;transform:translateY(-2px);box-shadow:0 5px 0 rgba(0,0,0,.22)}
    .tile.hint{animation:hintPulse 1s ease-in-out 2;outline:4px solid #e39c12;outline-offset:-4px}
    .tile.shake{animation:shake .42s ease}
    .message{min-height:38px;margin:12px auto 2px;text-align:center;font-size:17px;font-weight:800;display:flex;justify-content:center;align-items:center}
    .message.error{color:var(--danger)}
    .controls{display:flex;justify-content:center;flex-wrap:wrap;gap:9px;margin-top:8px}
    .control{border:1.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;padding:10px 17px;font-size:16px;font-weight:700;cursor:pointer;min-width:80px}
    .control.primary{background:var(--ink);color:#fff}
    .control:disabled{opacity:.32;cursor:not-allowed}
    .attempts{margin-top:20px;display:flex;align-items:center;justify-content:center;gap:9px;font-size:17px;font-weight:700}
    .dots{display:flex;gap:6px;direction:ltr}.dot{width:16px;height:16px;border-radius:50%;background:#1e1e1e;transition:transform .2s,opacity .2s}.dot.used{opacity:.15;transform:scale(.72)}
    .end-panel{display:none;margin-top:19px;padding:18px;border:2px solid var(--ink);border-radius:var(--radius);text-align:center;font-size:20px;font-weight:800;background:#fff;box-shadow:var(--shadow)}
    .end-panel.show{display:block;animation:solveIn .45s ease}
    .loading,.error-box{text-align:center;padding:45px 10px;font-size:18px}.error-box{color:var(--danger)}
    @keyframes solveIn{0%{opacity:0;transform:scale(.86) translateY(20px)}70%{transform:scale(1.025) translateY(-2px)}100%{opacity:1;transform:scale(1) translateY(0)}}
    @keyframes hintPulse{50%{transform:scale(1.055)}}
    @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
    @keyframes fallAway{to{opacity:0;transform:scale(.8) translateY(25px)}}
    .leaving{animation:fallAway .32s ease forwards}
    @media(max-width:520px){.app{padding-inline:9px}.grid{gap:6px}.tile{min-height:72px;border-radius:6px;padding:4px 3px}.controls{gap:7px}.control{padding:9px 13px;min-width:auto;font-size:14px}.solved-card{min-height:82px}}
  </style>
</head>
<body>
<main class="app">
  <header class="mast"><h1 id="title">מה הקשר?</h1><div id="subtitle" class="subtitle">טוען חידה...</div></header>
  <section id="solvedGroups" class="solved-groups"></section>
  <section id="grid" class="grid" aria-label="לוח המשחק"></section>
  <div id="message" class="message" aria-live="polite"></div>
  <div class="controls">
    <button id="hintBtn" class="control">רמז</button>
    <button id="shuffleBtn" class="control">ערבוב</button>
    <button id="clearBtn" class="control">ניקוי</button>
    <button id="submitBtn" class="control primary" disabled>אישור</button>
  </div>
  <div class="attempts"><span>ניסיונות שנותרו:</span><div id="dots" class="dots"></div></div>
  <div id="endPanel" class="end-panel"></div>
</main>
<script>
let data,groups,MAX_ATTEMPTS,hintWords,remainingWords=[],selected=[],solved=[],mistakes=0,gameOver=false,hintUsed=false,busy=false;
const triedSelections=new Set();
const $=id=>document.getElementById(id),grid=$('grid'),solvedGroups=$('solvedGroups'),message=$('message'),dots=$('dots'),endPanel=$('endPanel'),hintBtn=$('hintBtn'),shuffleBtn=$('shuffleBtn'),clearBtn=$('clearBtn'),submitBtn=$('submitBtn');
function shuffleArray(a){const c=[...a];for(let i=c.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[c[i],c[j]]=[c[j],c[i]]}return c}
function selectionKey(words){return [...words].sort((a,b)=>a.localeCompare(b,'he')).join('\u0001')}
function setMessage(text,type=''){message.textContent=text;message.className='message'+(type?' '+type:'')}
function groupColorIndex(group){return groups.indexOf(group)%4}
function render(){
  grid.innerHTML='';
  remainingWords.forEach(word=>{const b=document.createElement('button');b.className='tile';b.textContent=word;b.dataset.word=word;if(selected.includes(word))b.classList.add('selected');if(hintUsed&&hintWords.includes(word))b.classList.add('hint');b.onclick=()=>toggleWord(word);grid.appendChild(b)});
  solvedGroups.innerHTML='';solved.forEach(group=>{const c=document.createElement('div');c.className=`solved-card group-${groupColorIndex(group)}`;c.innerHTML=`<strong>${escapeHtml(group.title)}</strong><span>${group.words.map(escapeHtml).join(' · ')}</span>`;solvedGroups.appendChild(c)});
  dots.innerHTML='';for(let i=0;i<MAX_ATTEMPTS;i++){const d=document.createElement('span');d.className='dot'+(i<mistakes?' used':'');dots.appendChild(d)}
  submitBtn.disabled=selected.length!==4||gameOver||busy;clearBtn.disabled=!selected.length||gameOver||busy;shuffleBtn.disabled=gameOver||busy;hintBtn.disabled=hintUsed||gameOver||busy;
}
function escapeHtml(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function toggleWord(word){if(gameOver||busy)return;if(selected.includes(word))selected=selected.filter(x=>x!==word);else if(selected.length<4)selected.push(word);setMessage('');render()}
function animateWrong(){document.querySelectorAll('.tile.selected').forEach(t=>t.classList.add('shake'))}
async function animateCorrect(words){busy=true;document.querySelectorAll('.tile').forEach(t=>{if(words.includes(t.dataset.word))t.classList.add('leaving')});await new Promise(r=>setTimeout(r,340));busy=false}
async function submitSelection(){
  if(selected.length!==4||gameOver||busy)return;
  const current=[...selected],key=selectionKey(current);
  if(triedSelections.has(key)){setMessage('כבר ניסית את הרביעייה הזאת.','error');animateWrong();setTimeout(()=>{selected=[];render()},450);return}
  triedSelections.add(key);
  const match=groups.find(g=>!solved.includes(g)&&g.words.every(w=>current.includes(w)));
  if(match){await animateCorrect(current);solved.push(match);remainingWords=remainingWords.filter(w=>!match.words.includes(w));selected=[];setMessage('נכון!');hintUsed=false;if(solved.length===groups.length)finishGame(true);render()}
  else{mistakes++;const close=groups.find(g=>!solved.includes(g)&&g.words.filter(w=>current.includes(w)).length===3);setMessage(close?'אחת רחוקה!':'לא הפעם.','error');animateWrong();setTimeout(()=>{selected=[];if(mistakes>=MAX_ATTEMPTS)finishGame(false);render()},470)}
}
function finishGame(won){gameOver=true;endPanel.className='end-panel show';endPanel.textContent=won?'כל הכבוד! מצאת את כל ארבע הקבוצות.':'נגמרו הניסיונות — הנה הפתרון.';if(!won){groups.filter(g=>!solved.includes(g)).forEach(g=>solved.push(g));remainingWords=[]}}
hintBtn.onclick=()=>{hintUsed=true;selected=hintWords.filter(w=>remainingWords.includes(w));setMessage('שתי המילים המסומנות שייכות לאותה קבוצה.');render()};
shuffleBtn.onclick=()=>{remainingWords=shuffleArray(remainingWords);selected=[];setMessage('');render()};clearBtn.onclick=()=>{selected=[];setMessage('');render()};submitBtn.onclick=submitSelection;
async function start(){try{const r=await fetch('game-data.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('לא נמצא game-data.json');data=await r.json();groups=data.groups;MAX_ATTEMPTS=data.maxAttempts||6;hintWords=data.hintWords||[];$('title').textContent=data.title||'מה הקשר?';$('subtitle').textContent=data.subtitle||'חברו ארבע קבוצות של ארבע';remainingWords=shuffleArray(groups.flatMap(g=>g.words));render()}catch(e){$('subtitle').textContent='';grid.innerHTML=`<div class="error-box">שגיאה בטעינת החידה: ${escapeHtml(e.message)}</div>`}}
start();
</script>
</body></html>
