<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fffdf8">
<title>מה הקשר?</title>
<style>
:root{--paper:#fffdf8;--ink:#171717;--muted:#6f6b64;--tile:#efeee9;--selected:#202020;--line:#d9d6ce;--red:#e39a9a;--green:#a8d78c;--blue:#88c9e8;--purple:#b69ad9;--danger:#bb3434;--shadow:0 3px 0 rgba(0,0,0,.12);--radius:8px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:Arial,"Noto Sans Hebrew",sans-serif}button,input{font:inherit}.app{width:min(760px,100%);margin:auto;padding:22px 14px calc(38px + env(safe-area-inset-bottom))}.mast{text-align:center;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:20px}h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(38px,10vw,72px);letter-spacing:-2px;margin:0;line-height:.95}.subtitle{font-size:clamp(16px,3.7vw,21px);margin-top:12px}.puzzle-number,.archive-note,.player-line{font-size:14px;color:var(--muted);margin-top:7px}.player-line button{border:0;background:none;text-decoration:underline;color:inherit;padding:0;cursor:pointer}.solved-groups{display:grid;gap:9px;margin-bottom:9px}.solved-card{min-height:92px;border-radius:var(--radius);padding:13px 10px;text-align:center;display:flex;flex-direction:column;justify-content:center;box-shadow:var(--shadow)}.solved-card.new-solved{animation:solveIn .58s cubic-bezier(.2,.85,.25,1.25)}.solved-card strong{font-size:clamp(16px,3.7vw,22px);margin-bottom:7px}.solved-card span{font-size:clamp(14px,3.3vw,18px);font-weight:700}.group-0{background:var(--red)}.group-1{background:var(--green)}.group-2{background:var(--blue)}.group-3{background:var(--purple)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.tile{aspect-ratio:1.24/1;min-height:82px;border:0;border-radius:var(--radius);background:var(--tile);color:var(--ink);font-size:clamp(15px,3.5vw,22px);font-weight:800;padding:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.08;overflow-wrap:anywhere;box-shadow:var(--shadow);transition:transform .14s,background .14s,color .14s,box-shadow .14s;touch-action:manipulation}.tile:active{transform:scale(.96)}.tile.selected{background:var(--selected);color:#fff;transform:translateY(-2px);box-shadow:0 5px 0 rgba(0,0,0,.22)}.tile.hint{animation:hintPulse 1s ease-in-out 2;outline:4px solid #e39c12;outline-offset:-4px}.tile.shake{animation:shake .42s ease}.message{min-height:38px;margin:12px auto 2px;text-align:center;font-size:17px;font-weight:800;display:flex;justify-content:center;align-items:center}.message.error{color:var(--danger)}.controls{display:flex;justify-content:center;flex-wrap:wrap;gap:9px;margin-top:8px}.control{border:1.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;padding:10px 17px;font-size:16px;font-weight:700;cursor:pointer}.control.primary{background:var(--ink);color:#fff}.control:disabled{opacity:.32}.attempts{margin-top:20px;display:flex;align-items:center;justify-content:center;gap:9px;font-size:17px;font-weight:700}.dots{display:flex;gap:6px;direction:ltr}.dot{width:16px;height:16px;border-radius:50%;background:#1e1e1e;transition:.2s}.dot.used{opacity:.15;transform:scale(.72)}.end-panel{display:none;margin-top:19px;padding:18px;border:2px solid var(--ink);border-radius:var(--radius);text-align:center;background:#fff;box-shadow:var(--shadow)}.end-panel.show{display:block;animation:solveIn .45s ease}.end-title{font-size:21px;font-weight:800}.end-actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:14px}.personal{display:none;margin-top:14px;padding:13px;border-radius:10px;background:#f5f2ea}.personal.show{display:block}.personal strong{display:block;font-size:18px;margin-bottom:6px}.stats{display:none;margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:17px;box-shadow:0 2px 0 #0001}.stats.show{display:block}.stats h2{margin:0 0 12px;text-align:center;font-size:23px}.stats-total{text-align:center;font-weight:800;margin-bottom:14px}.stat-row{display:grid;grid-template-columns:1fr auto;gap:12px;padding:6px 2px;border-bottom:1px solid #eee}.stat-row:last-child{border-bottom:0}.stat-row b{direction:ltr}.archive{margin-top:42px;border-top:2px solid var(--ink);padding-top:24px}.archive h2{text-align:center;font-size:27px;margin:0 0 15px}.archive-list{display:grid;gap:9px}.archive-item{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:13px 14px;color:inherit;text-decoration:none;box-shadow:0 2px 0 rgba(0,0,0,.08)}.archive-item strong{display:block;font-size:17px}.archive-item span{display:block;color:var(--muted);font-size:13px;margin-top:4px}.archive-item b{font-size:22px}.empty{text-align:center;color:var(--muted)}.error-box{text-align:center;padding:45px 10px;color:var(--danger)}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.show{display:flex}.dialog{width:min(440px,100%);background:var(--paper);border:2px solid var(--ink);border-radius:14px;padding:20px;box-shadow:0 8px 30px #0005}.dialog h2{margin:0 0 10px;text-align:center}.dialog p{line-height:1.45}.dialog input{width:100%;padding:12px;border:1.5px solid #aaa;border-radius:8px;font-size:17px}.dialog-actions{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:14px}.small-note{font-size:13px;color:var(--muted);line-height:1.4;margin-top:10px}.name-error{color:var(--danger);font-weight:700;min-height:22px;margin-top:8px;text-align:center}
@keyframes solveIn{0%{opacity:0;transform:scale(.86) translateY(20px)}70%{transform:scale(1.025) translateY(-2px)}100%{opacity:1;transform:none}}@keyframes hintPulse{50%{transform:scale(1.055)}}@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}@keyframes fallAway{to{opacity:0;transform:scale(.8) translateY(25px)}}.leaving{animation:fallAway .32s ease forwards}@media(max-width:520px){.app{padding-inline:9px}.grid{gap:6px}.tile{min-height:72px;border-radius:6px;padding:4px 3px}.control{padding:9px 13px;font-size:14px}.solved-card{min-height:82px}}
</style>
</head>
<body>
<main class="app">
<header class="mast"><h1 id="title">מה הקשר?</h1><div id="subtitle" class="subtitle">טוען חידה...</div><div id="puzzleNumber" class="puzzle-number"></div><div id="archiveNote" class="archive-note"></div><div id="playerLine" class="player-line"></div></header>
<section id="solvedGroups" class="solved-groups"></section><section id="grid" class="grid"></section><div id="message" class="message" aria-live="polite"></div>
<div class="controls"><button id="hintBtn" class="control">רמז</button><button id="shuffleBtn" class="control">ערבוב</button><button id="clearBtn" class="control">ניקוי</button><button id="submitBtn" class="control primary" disabled>אישור</button></div>
<div class="attempts"><span>ניסיונות שנותרו:</span><div id="dots" class="dots"></div></div>
<section id="endPanel" class="end-panel"><div id="endTitle" class="end-title"></div><div id="personal" class="personal"></div><div class="end-actions"><button id="shareBtn" class="control primary">שתף תוצאה</button><button id="sharePuzzleBtn" class="control">שתף חידה</button></div></section>
<section id="stats" class="stats"><h2>סטטיסטיקות החידה</h2><div id="statsBody"></div></section>
<section class="archive"><h2>משחקים קודמים</h2><div id="archiveList" class="archive-list"></div></section>
</main>
<div id="nameModal" class="modal"><div class="dialog"><h2>ברוכים הבאים!</h2><p>איך קוראים לך?</p><input id="nameInput" maxlength="40" autocomplete="name"><div id="nameError" class="name-error"></div><div class="dialog-actions"><button id="continueName" class="control primary">המשך</button><button id="continueGuest" class="control">המשך כאורח</button></div><div class="small-note">אם תבחר שם, נשמור עבורך סטטיסטיקות אישיות ורצף הצלחות. אם תמשיך כאורח, המשחק יעבוד כרגיל, אך ההתקדמות האישית לא תישמר במכשיר או בדפדפן חדש.</div></div></div>
<div id="existingModal" class="modal"><div class="dialog"><h2 id="existingTitle">מצאנו שחקן בשם הזה</h2><p>זה אתה?</p><div class="dialog-actions"><button id="yesExisting" class="control primary">כן, זה אני</button><button id="noExisting" class="control">לא, בחר שם אחר</button></div></div></div>
<script>
const FIREBASE_URL='https://mahakesher-ada29-default-rtdb.europe-west1.firebasedatabase.app';
let puzzle=null,groups=[],maxAttempts=6,hintWords=[],remainingWords=[],selected=[],solved=[],mistakes=0,gameOver=false,gameWon=null,hintUsed=false,busy=false,isArchived=false,currentPlayer=null,pendingExisting=null;
const triedSelections=new Set(),animatedSolvedGroups=new Set();
const $=id=>document.getElementById(id),grid=$('grid'),solvedGroups=$('solvedGroups'),message=$('message'),dots=$('dots');
const escapeHtml=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
const selectionKey=a=>[...a].sort((x,y)=>x.localeCompare(y,'he')).join('\u0001');
function shuffleArray(a){const c=[...a];for(let i=c.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[c[i],c[j]]=[c[j],c[i]]}return c}
async function dbGet(path){const r=await fetch(`${FIREBASE_URL}/${path}.json?ts=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw new Error('שגיאה בקריאת הנתונים');return r.json()}
async function dbPut(path,data){const r=await fetch(`${FIREBASE_URL}/${path}.json`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(!r.ok)throw new Error('שגיאה בשמירת הנתונים');return r.json()}
async function dbPatch(path,data){const r=await fetch(`${FIREBASE_URL}/${path}.json`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(!r.ok)throw new Error('שגיאה בשמירת הנתונים');return r.json()}
async function atomicIncrement(path){for(let i=0;i<8;i++){const url=`${FIREBASE_URL}/${path}.json`;const r=await fetch(url,{headers:{'X-Firebase-ETag':'true'},cache:'no-store'});if(!r.ok)return;const etag=r.headers.get('ETag');const current=await r.json();const w=await fetch(url,{method:'PUT',headers:{'Content-Type':'application/json','If-Match':etag},body:JSON.stringify((Number(current)||0)+1)});if(w.ok)return;if(w.status!==412)return}}
function normalizeName(name){return name.trim().replace(/\s+/g,' ').toLocaleLowerCase('he')}
function nameKey(name){const bytes=new TextEncoder().encode(normalizeName(name));let s='';bytes.forEach(b=>s+=String.fromCharCode(b));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function newId(){return crypto.randomUUID?crypto.randomUUID():`p-${Date.now()}-${Math.random().toString(36).slice(2)}`}
function startedKey(){return `mh_started_${puzzle.id}`}function finishedKey(){return `mh_finished_${puzzle.id}`}
async function recordStart(){if(localStorage.getItem(startedKey()))return;localStorage.setItem(startedKey(),'1');await atomicIncrement(`stats/${puzzle.id}/started`).catch(()=>{})}
async function recordFinish(won){if(localStorage.getItem(finishedKey()))return;localStorage.setItem(finishedKey(),'1');const path=won?`stats/${puzzle.id}/solved/${mistakes}`:`stats/${puzzle.id}/failed`;await atomicIncrement(path).catch(()=>{})}
async function recordPlayerResult(won){if(!currentPlayer||currentPlayer.guest)return null;const existing=await dbGet(`playerResults/${currentPlayer.id}/${puzzle.id}`).catch(()=>null);if(existing)return await dbGet(`players/${currentPlayer.id}`).catch(()=>currentPlayer);
const profile=await dbGet(`players/${currentPlayer.id}`).catch(()=>null)||currentPlayer;const current=Number(profile.currentStreak)||0;const best=Number(profile.bestStreak)||0;const nextStreak=won?current+1:0;const result={won, mistakes, puzzleId:puzzle.id,puzzleNumber:puzzle.number||null,completedAt:new Date().toISOString()};const updates={};updates[`playerResults/${currentPlayer.id}/${puzzle.id}`]=result;updates[`players/${currentPlayer.id}/currentStreak`]=nextStreak;updates[`players/${currentPlayer.id}/bestStreak`]=Math.max(best,nextStreak);updates[`players/${currentPlayer.id}/played`]=(Number(profile.played)||0)+1;updates[`players/${currentPlayer.id}/solved`]=(Number(profile.solved)||0)+(won?1:0);updates[`players/${currentPlayer.id}/lastPlayedAt`]=new Date().toISOString();await dbPatch('',updates);currentPlayer={...profile,currentStreak:nextStreak,bestStreak:Math.max(best,nextStreak),played:(Number(profile.played)||0)+1,solved:(Number(profile.solved)||0)+(won?1:0)};localStorage.setItem('mh_player',JSON.stringify({id:currentPlayer.id,name:currentPlayer.name}));renderPlayerLine();return currentPlayer}
function setMessage(t,type=''){message.textContent=t;message.className='message'+(type?' '+type:'')}
function renderPlayerLine(){if(!currentPlayer)return $('playerLine').innerHTML='';if(currentPlayer.guest)$('playerLine').innerHTML='משחק כאורח · <button id="changePlayer">בחר שחקן</button>';else $('playerLine').innerHTML=`שחקן: ${escapeHtml(currentPlayer.name)} · רצף ${Number(currentPlayer.currentStreak)||0} · <button id="changePlayer">החלף שחקן</button>`;const b=$('changePlayer');if(b)b.onclick=()=>{localStorage.removeItem('mh_player');currentPlayer=null;showNameModal()}}
function render(){grid.innerHTML='';remainingWords.forEach(word=>{const b=document.createElement('button');b.className='tile';b.textContent=word;b.dataset.word=word;if(selected.includes(word))b.classList.add('selected');if(hintUsed&&hintWords.includes(word))b.classList.add('hint');b.onclick=()=>toggleWord(word);grid.appendChild(b)});solvedGroups.innerHTML='';solved.forEach(g=>{const c=document.createElement('div'),isNew=!animatedSolvedGroups.has(g);c.className=`solved-card group-${groups.indexOf(g)%4}${isNew?' new-solved':''}`;c.innerHTML=`<strong>${escapeHtml(g.title)}</strong><span>${g.words.map(escapeHtml).join(' · ')}</span>`;solvedGroups.appendChild(c);if(isNew)animatedSolvedGroups.add(g)});dots.innerHTML='';for(let i=0;i<maxAttempts;i++){const d=document.createElement('span');d.className='dot'+(i<mistakes?' used':'');dots.appendChild(d)}$('submitBtn').disabled=selected.length!==4||gameOver||busy;$('clearBtn').disabled=!selected.length||gameOver||busy;$('shuffleBtn').disabled=gameOver||busy;$('hintBtn').disabled=hintUsed||gameOver||busy}
function toggleWord(word){if(gameOver||busy)return;if(selected.includes(word))selected=selected.filter(x=>x!==word);else if(selected.length<4)selected.push(word);setMessage('');render()}
async function submitSelection(){if(selected.length!==4||gameOver||busy)return;const key=selectionKey(selected);if(triedSelections.has(key)){setMessage('כבר ניסית את הרביעייה הזאת.');selected=[];render();return}triedSelections.add(key);const match=groups.find(g=>!solved.includes(g)&&g.words.every(w=>selected.includes(w)));if(match){busy=true;document.querySelectorAll('.tile.selected').forEach(e=>e.classList.add('leaving'));await new Promise(r=>setTimeout(r,330));solved.push(match);remainingWords=remainingWords.filter(w=>!match.words.includes(w));selected=[];hintUsed=false;setMessage('נכון!');busy=false;if(solved.length===groups.length)await finishGame(true);render()}else{mistakes++;const close=groups.some(g=>!solved.includes(g)&&g.words.filter(w=>selected.includes(w)).length===3);setMessage(close?'כמעט, שלוש מארבע':'לא נכון','error');document.querySelectorAll('.tile.selected').forEach(e=>e.classList.add('shake'));selected=[];if(mistakes>=maxAttempts)await finishGame(false);render()}}
async function finishGame(won){gameOver=true;gameWon=won;if(!won){groups.filter(g=>!solved.includes(g)).forEach(g=>solved.push(g));remainingWords=[]}$('endTitle').textContent=won?'כל הכבוד! פתרת את החידה.':'לא הצלחת הפעם.';$('endPanel').classList.add('show');await recordFinish(won);const profile=await recordPlayerResult(won).catch(()=>null);if(profile&&!currentPlayer.guest){$('personal').classList.add('show');$('personal').innerHTML=`<strong>${won?'הרצף שלך עלה ל־':'הרצף שלך התאפס ל־'}${Number(profile.currentStreak)||0}</strong>שיא רצף: ${Number(profile.bestStreak)||0} · פתרת ${Number(profile.solved)||0} מתוך ${Number(profile.played)||0}`}$('stats').classList.add('show');await loadStats();render()}
function pct(n,total){return total?Math.round((Number(n||0)/total)*100):0}
async function loadStats(){const s=await dbGet(`stats/${puzzle.id}`).catch(()=>({}));const solvedStats=s?.solved||{};const solvedTotal=Object.values(solvedStats).reduce((a,b)=>a+Number(b||0),0);const failed=Number(s?.failed)||0;const total=solvedTotal+failed;let html=`<div class="stats-total">סה״כ סיימו: ${total}</div>`;for(let i=0;i<maxAttempts;i++){const label=i===0?'פתרו ללא טעויות':i===1?'פתרו עם טעות אחת':`פתרו עם ${i} טעויות`;html+=`<div class="stat-row"><span>${label}</span><b>${pct(solvedStats[i],total)}%</b></div>`}html+=`<div class="stat-row"><span>לא הצליחו</span><b>${pct(failed,total)}%</b></div>`;$('statsBody').innerHTML=html}
function shareText(){const n=puzzle.number?` #${puzzle.number}`:'';const result=gameWon===false?'לא הצלחתי, תנסו אתם':mistakes===0?'פתרתי ללא טעויות':mistakes===1?'פתרתי עם טעות אחת':`פתרתי עם ${mistakes} טעויות`;return `מה הקשר?${n}\n\n${result}\n\n${puzzleUrl()}`}
function puzzleUrl(){const u=new URL(location.href);u.search='';if(isArchived||puzzle.id!==window.currentId)u.searchParams.set('game',puzzle.id);return u.toString()}
async function share(text){if(navigator.share)try{await navigator.share({text,url:puzzleUrl()});return}catch(e){if(e.name==='AbortError')return}await navigator.clipboard.writeText(text);setMessage('הטקסט הועתק ללוח.')}
async function loadArchive(all,currentId){const list=Object.values(all||{}).filter(p=>p?.published&&p.id!==currentId).sort((a,b)=>(b.number||0)-(a.number||0));$('archiveList').innerHTML=list.length?list.map(p=>`<a class="archive-item" href="?game=${encodeURIComponent(p.id)}"><div><strong>חידה #${p.number||''}</strong><span>${escapeHtml(p.subtitle||'')}</span></div><b>←</b></a>`).join(''):'<div class="empty">עדיין אין משחקים קודמים.</div>'}
async function loadPuzzle(){try{const currentId=await dbGet('currentId');window.currentId=currentId;const all=await dbGet('puzzles')||{};const wanted=new URLSearchParams(location.search).get('game');let p=wanted?all[wanted]:all[currentId];if(!p){const r=await fetch(`game-data.json?ts=${Date.now()}`,{cache:'no-store'});if(r.ok){p=await r.json();p.id='legacy-current';p.number=p.number||1}else throw new Error('לא נמצאה חידה')}puzzle=p;isArchived=!!wanted&&p.id!==currentId;groups=p.groups||[];maxAttempts=Number(p.maxAttempts)||6;hintWords=p.hintWords||[];remainingWords=shuffleArray(groups.flatMap(g=>g.words));$('title').textContent=p.title||'מה הקשר?';$('subtitle').textContent=p.subtitle||'חברו ארבע קבוצות של ארבע';$('puzzleNumber').textContent=p.number?`חידה #${p.number}`:'';$('archiveNote').textContent=isArchived?'משחק קודם':'';await loadArchive(all,currentId);render();await recordStart();await initPlayer()}catch(e){document.querySelector('.app').innerHTML=`<div class="error-box">${escapeHtml(e.message)}</div>`}}
function showNameModal(){$('nameInput').value='';$('nameError').textContent='';$('nameModal').classList.add('show');setTimeout(()=>$('nameInput').focus(),100)}
async function initPlayer(){const saved=localStorage.getItem('mh_player');if(saved){try{const info=JSON.parse(saved);if(info.guest){currentPlayer={guest:true};renderPlayerLine();return}const profile=await dbGet(`players/${info.id}`);if(profile){currentPlayer={id:info.id,...profile};renderPlayerLine();return}}catch(e){}localStorage.removeItem('mh_player')}showNameModal()}
async function chooseName(){const name=$('nameInput').value.trim().replace(/\s+/g,' ');if(!name){$('nameError').textContent='צריך להכניס שם.';return}if(name.length>40){$('nameError').textContent='השם ארוך מדי.';return}const key=nameKey(name);const existingId=await dbGet(`playerNames/${key}`).catch(()=>null);if(existingId){pendingExisting={id:existingId,name,key};$('nameModal').classList.remove('show');$('existingTitle').textContent=`מצאנו שחקן בשם "${name}".`;$('existingModal').classList.add('show');return}const id=newId(),profile={name,currentStreak:0,bestStreak:0,played:0,solved:0,createdAt:new Date().toISOString()};await dbPatch('',{[`players/${id}`]:profile,[`playerNames/${key}`]:id});currentPlayer={id,...profile};localStorage.setItem('mh_player',JSON.stringify({id,name}));$('nameModal').classList.remove('show');renderPlayerLine()}
$('continueName').onclick=()=>chooseName().catch(e=>$('nameError').textContent=e.message);$('nameInput').addEventListener('keydown',e=>{if(e.key==='Enter')$('continueName').click()});$('continueGuest').onclick=()=>{currentPlayer={guest:true};localStorage.setItem('mh_player',JSON.stringify({guest:true}));$('nameModal').classList.remove('show');renderPlayerLine()};$('yesExisting').onclick=async()=>{const profile=await dbGet(`players/${pendingExisting.id}`).catch(()=>({name:pendingExisting.name,currentStreak:0,bestStreak:0,played:0,solved:0}));currentPlayer={id:pendingExisting.id,...profile};localStorage.setItem('mh_player',JSON.stringify({id:currentPlayer.id,name:currentPlayer.name}));$('existingModal').classList.remove('show');renderPlayerLine()};$('noExisting').onclick=()=>{$('existingModal').classList.remove('show');showNameModal()};
$('submitBtn').onclick=submitSelection;$('clearBtn').onclick=()=>{selected=[];setMessage('');render()};$('shuffleBtn').onclick=()=>{remainingWords=shuffleArray(remainingWords);selected=[];setMessage('');render()};$('hintBtn').onclick=()=>{hintUsed=true;selected=hintWords.filter(w=>remainingWords.includes(w));setMessage('שתי המילים המסומנות שייכות לאותה קבוצה.');render()};$('shareBtn').onclick=()=>share(shareText());$('sharePuzzleBtn').onclick=()=>share(`נסו את החידה: ${puzzleUrl()}`);
loadPuzzle();
</script>
