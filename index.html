<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fffdf8">
  <title>מה הקשר?</title>
  <style>
    :root{--paper:#fffdf8;--ink:#171717;--muted:#6f6b64;--tile:#efeee9;--selected:#202020;--line:#d9d6ce;--yellow:#f2df68;--green:#a8d78c;--blue:#88c9e8;--purple:#b69ad9;--danger:#bb3434;--shadow:0 3px 0 rgba(0,0,0,.12);--radius:8px}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:Arial,"Noto Sans Hebrew",sans-serif}button{font:inherit}.app{width:min(760px,100%);margin:auto;padding:22px 14px calc(38px + env(safe-area-inset-bottom))}.mast{text-align:center;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:20px}h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(38px,10vw,72px);letter-spacing:-2px;margin:0;line-height:.95}.subtitle{font-size:clamp(16px,3.7vw,21px);margin-top:12px}.puzzle-number,.archive-note{font-size:14px;color:var(--muted);margin-top:7px}.solved-groups{display:grid;gap:9px;margin-bottom:9px}.solved-card{min-height:92px;border-radius:var(--radius);padding:13px 10px;text-align:center;display:flex;flex-direction:column;justify-content:center;box-shadow:var(--shadow)}.solved-card.new-solved{animation:solveIn .58s cubic-bezier(.2,.85,.25,1.25)}.solved-card strong{font-size:clamp(16px,3.7vw,22px);margin-bottom:7px}.solved-card span{font-size:clamp(14px,3.3vw,18px);font-weight:700}.group-0{background:var(--yellow)}.group-1{background:var(--green)}.group-2{background:var(--blue)}.group-3{background:var(--purple)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.tile{aspect-ratio:1.24/1;min-height:82px;border:0;border-radius:var(--radius);background:var(--tile);color:var(--ink);font-size:clamp(15px,3.5vw,22px);font-weight:800;padding:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.08;overflow-wrap:anywhere;box-shadow:var(--shadow);transition:transform .14s,background .14s,color .14s,box-shadow .14s;touch-action:manipulation}.tile:active{transform:scale(.96)}.tile.selected{background:var(--selected);color:#fff;transform:translateY(-2px);box-shadow:0 5px 0 rgba(0,0,0,.22)}.tile.hint{animation:hintPulse 1s ease-in-out 2;outline:4px solid #e39c12;outline-offset:-4px}.tile.shake{animation:shake .42s ease}.message{min-height:38px;margin:12px auto 2px;text-align:center;font-size:17px;font-weight:800;display:flex;justify-content:center;align-items:center}.message.error{color:var(--danger)}.controls{display:flex;justify-content:center;flex-wrap:wrap;gap:9px;margin-top:8px}.control{border:1.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;padding:10px 17px;font-size:16px;font-weight:700;cursor:pointer}.control.primary{background:var(--ink);color:#fff}.control:disabled{opacity:.32}.attempts{margin-top:20px;display:flex;align-items:center;justify-content:center;gap:9px;font-size:17px;font-weight:700}.dots{display:flex;gap:6px;direction:ltr}.dot{width:16px;height:16px;border-radius:50%;background:#1e1e1e;transition:.2s}.dot.used{opacity:.15;transform:scale(.72)}.end-panel{display:none;margin-top:19px;padding:18px;border:2px solid var(--ink);border-radius:var(--radius);text-align:center;background:#fff;box-shadow:var(--shadow)}.end-panel.show{display:block;animation:solveIn .45s ease}.end-title{font-size:21px;font-weight:800}.end-actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:14px}.stats{display:none;margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:17px;box-shadow:0 2px 0 #0001}.stats.show{display:block}.stats h2{margin:0 0 12px;text-align:center;font-size:23px}.stats-total{text-align:center;font-weight:800;margin-bottom:14px}.stat-row{display:grid;grid-template-columns:1fr auto;gap:12px;padding:6px 2px;border-bottom:1px solid #eee}.stat-row:last-child{border-bottom:0}.stat-row b{direction:ltr}.archive{margin-top:42px;border-top:2px solid var(--ink);padding-top:24px}.archive h2{text-align:center;font-size:27px;margin:0 0 15px}.archive-list{display:grid;gap:9px}.archive-item{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:13px 14px;color:inherit;text-decoration:none;box-shadow:0 2px 0 rgba(0,0,0,.08)}.archive-item strong{display:block;font-size:17px}.archive-item span{display:block;color:var(--muted);font-size:13px;margin-top:4px}.archive-item b{font-size:22px}.empty{text-align:center;color:var(--muted)}.error-box{text-align:center;padding:45px 10px;color:var(--danger)}
    @keyframes solveIn{0%{opacity:0;transform:scale(.86) translateY(20px)}70%{transform:scale(1.025) translateY(-2px)}100%{opacity:1;transform:none}}@keyframes hintPulse{50%{transform:scale(1.055)}}@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}@keyframes fallAway{to{opacity:0;transform:scale(.8) translateY(25px)}}.leaving{animation:fallAway .32s ease forwards}@media(max-width:520px){.app{padding-inline:9px}.grid{gap:6px}.tile{min-height:72px;border-radius:6px;padding:4px 3px}.control{padding:9px 13px;font-size:14px}.solved-card{min-height:82px}}
  </style>
</head>
<body>
<main class="app">
  <header class="mast"><h1 id="title">מה הקשר?</h1><div id="subtitle" class="subtitle">טוען חידה...</div><div id="puzzleNumber" class="puzzle-number"></div><div id="archiveNote" class="archive-note"></div></header>
  <section id="solvedGroups" class="solved-groups"></section>
  <section id="grid" class="grid"></section>
  <div id="message" class="message" aria-live="polite"></div>
  <div class="controls"><button id="hintBtn" class="control">רמז</button><button id="shuffleBtn" class="control">ערבוב</button><button id="clearBtn" class="control">ניקוי</button><button id="submitBtn" class="control primary" disabled>אישור</button></div>
  <div class="attempts"><span>ניסיונות שנותרו:</span><div id="dots" class="dots"></div></div>
  <section id="endPanel" class="end-panel"><div id="endTitle" class="end-title"></div><div class="end-actions"><button id="shareBtn" class="control primary">שתף תוצאה</button><button id="sharePuzzleBtn" class="control">שתף חידה</button></div></section>
  <section id="stats" class="stats"><h2>סטטיסטיקות החידה</h2><div id="statsBody"></div></section>
  <section class="archive"><h2>משחקים קודמים</h2><div id="archiveList" class="archive-list"></div></section>
</main>
<script>
const FIREBASE_URL='https://mahakesher-ada29-default-rtdb.europe-west1.firebasedatabase.app';
let puzzle=null,groups=[],maxAttempts=6,hintWords=[],remainingWords=[],selected=[],solved=[],mistakes=0,gameOver=false,hintUsed=false,busy=false,isArchived=false;
const triedSelections=new Set(),animatedSolvedGroups=new Set();
const $=id=>document.getElementById(id),grid=$('grid'),solvedGroups=$('solvedGroups'),message=$('message'),dots=$('dots');
const escapeHtml=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
const selectionKey=a=>[...a].sort((x,y)=>x.localeCompare(y,'he')).join('\u0001');
function shuffleArray(a){const c=[...a];for(let i=c.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[c[i],c[j]]=[c[j],c[i]]}return c}
async function dbGet(path){const r=await fetch(`${FIREBASE_URL}/${path}.json?ts=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw new Error('שגיאה בקריאת הנתונים');return r.json()}
async function atomicIncrement(path){for(let i=0;i<8;i++){const url=`${FIREBASE_URL}/${path}.json`;const r=await fetch(url,{headers:{'X-Firebase-ETag':'true'},cache:'no-store'});if(!r.ok)return;const etag=r.headers.get('ETag');const current=await r.json();const w=await fetch(url,{method:'PUT',headers:{'Content-Type':'application/json','If-Match':etag},body:JSON.stringify((Number(current)||0)+1)});if(w.ok)return;if(w.status!==412)return}}
function startedKey(){return `mh_started_${puzzle.id}`}function finishedKey(){return `mh_finished_${puzzle.id}`}
async function recordStart(){if(localStorage.getItem(startedKey()))return;localStorage.setItem(startedKey(),'1');await atomicIncrement(`stats/${puzzle.id}/started`).catch(()=>{})}
async function recordFinish(won){if(localStorage.getItem(finishedKey()))return;localStorage.setItem(finishedKey(),'1');const path=won?`stats/${puzzle.id}/solved/${mistakes}`:`stats/${puzzle.id}/failed`;await atomicIncrement(path).catch(()=>{})}
function setMessage(t,type=''){message.textContent=t;message.className='message'+(type?' '+type:'')}
function render(){grid.innerHTML='';remainingWords.forEach(word=>{const b=document.createElement('button');b.className='tile';b.textContent=word;b.dataset.word=word;if(selected.includes(word))b.classList.add('selected');if(hintUsed&&hintWords.includes(word))b.classList.add('hint');b.onclick=()=>toggleWord(word);grid.appendChild(b)});solvedGroups.innerHTML='';solved.forEach(g=>{const c=document.createElement('div'),isNew=!animatedSolvedGroups.has(g);c.className=`solved-card group-${groups.indexOf(g)%4}${isNew?' new-solved':''}`;c.innerHTML=`<strong>${escapeHtml(g.title)}</strong><span>${g.words.map(escapeHtml).join(' · ')}</span>`;solvedGroups.appendChild(c);if(isNew)animatedSolvedGroups.add(g)});dots.innerHTML='';for(let i=0;i<maxAttempts;i++){const d=document.createElement('span');d.className='dot'+(i<mistakes?' used':'');dots.appendChild(d)}$('submitBtn').disabled=selected.length!==4||gameOver||busy;$('clearBtn').disabled=!selected.length||gameOver||busy;$('shuffleBtn').disabled=gameOver||busy;$('hintBtn').disabled=hintUsed||gameOver||busy}
function toggleWord(w){if(gameOver||busy)return;if(selected.includes(w))selected=selected.filter(x=>x!==w);else if(selected.length<4)selected.push(w);setMessage('');render()}
function animateWrong(){document.querySelectorAll('.tile.selected').forEach(t=>t.classList.add('shake'))}
async function animateCorrect(words){busy=true;document.querySelectorAll('.tile').forEach(t=>{if(words.includes(t.dataset.word))t.classList.add('leaving')});await new Promise(r=>setTimeout(r,340));busy=false}
async function submitSelection(){if(selected.length!==4||gameOver||busy)return;const current=[...selected],key=selectionKey(current);if(triedSelections.has(key)){setMessage('כבר ניסית את הרביעייה הזאת.','error');animateWrong();setTimeout(()=>{selected=[];render()},450);return}triedSelections.add(key);const match=groups.find(g=>!solved.includes(g)&&g.words.every(w=>current.includes(w)));if(match){await animateCorrect(current);solved.push(match);remainingWords=remainingWords.filter(w=>!match.words.includes(w));selected=[];setMessage('נכון!');hintUsed=false;if(solved.length===groups.length)await finishGame(true);render()}else{mistakes++;const close=groups.find(g=>!solved.includes(g)&&g.words.filter(w=>current.includes(w)).length===3);setMessage(close?'כמעט, שלוש מארבע':'לא נכון','error');animateWrong();setTimeout(async()=>{selected=[];if(mistakes>=maxAttempts)await finishGame(false);render()},470)}}
async function finishGame(won){gameOver=true;$('endPanel').classList.add('show');$('endTitle').textContent=won?`כל הכבוד! פתרת עם ${mistakes===0?'אפס טעויות':mistakes===1?'טעות אחת':mistakes+' טעויות'}.`:'לא הצלחת לפתור הפעם.';if(!won){groups.filter(g=>!solved.includes(g)).forEach(g=>solved.push(g));remainingWords=[]}await recordFinish(won);await showStats()}
function percent(n,total){return total?Math.round((Number(n||0)/total)*100):0}
async function showStats(){const s=await dbGet(`stats/${puzzle.id}`).catch(()=>null)||{};const total=Number(s.started)||0;let html=`<div class="stats-total">סה״כ שיחקו: ${total}</div>`;for(let i=0;i<maxAttempts;i++){const label=i===0?'פתרו ללא טעויות':i===1?'פתרו עם טעות אחת':`פתרו עם ${i} טעויות`;html+=`<div class="stat-row"><span>${label}</span><b>${percent(s.solved?.[i],total)}%</b></div>`}html+=`<div class="stat-row"><span>לא הצליחו</span><b>${percent(s.failed,total)}%</b></div>`;$('statsBody').innerHTML=html;$('stats').classList.add('show')}
function puzzleUrl(){const u=new URL(location.href);u.search='';if(isArchived)u.searchParams.set('game',puzzle.id);return u.toString()}
async function shareText(result=false){let text=`מה הקשר? #${puzzle.number||''}`.trim();if(result)text+=gameOver&&solved.length===groups.length?`\n\nפתרתי עם ${mistakes===0?'אפס טעויות':mistakes===1?'טעות אחת':mistakes+' טעויות'}`:'\n\nלא הצלחתי לפתור';text+=`\n\n${puzzleUrl()}`;try{if(navigator.share)await navigator.share({text});else{await navigator.clipboard.writeText(text);setMessage('הקישור הועתק ללוח.')}}catch(e){if(e.name!=='AbortError')setMessage('לא הצלחתי לשתף.','error')}}
function formatDate(v){try{return new Intl.DateTimeFormat('he-IL',{dateStyle:'medium'}).format(new Date(v))}catch{return ''}}
async function renderArchive(){const all=await dbGet('puzzles').catch(()=>null)||{};const list=Object.values(all).filter(x=>x&&x.id!==puzzle.id&&x.published).sort((a,b)=>(b.number||0)-(a.number||0));$('archiveList').innerHTML=list.length?list.map(g=>`<a class="archive-item" href="?game=${encodeURIComponent(g.id)}"><div><strong>חידה #${g.number||''}</strong><span>${formatDate(g.publishedAt)}</span></div><b>‹</b></a>`).join(''):'<div class="empty">עדיין אין משחקים קודמים.</div>'}
function initGame(d,archived){puzzle=d;isArchived=archived;groups=d.groups||[];maxAttempts=Number(d.maxAttempts)||6;hintWords=d.hintWords||[];remainingWords=shuffleArray(groups.flatMap(g=>g.words));$('title').textContent=d.title||'מה הקשר?';$('subtitle').textContent=d.subtitle||'חברו ארבע קבוצות של ארבע';$('puzzleNumber').textContent=d.number?`חידה #${d.number}`:'';$('archiveNote').textContent=archived?'משחק מארכיון':'';render();recordStart()}
async function start(){try{const wanted=new URLSearchParams(location.search).get('game');let d;if(wanted){d=await dbGet(`puzzles/${wanted}`);if(!d)throw new Error('החידה לא נמצאה');initGame(d,true)}else{const id=await dbGet('currentId');if(id)d=await dbGet(`puzzles/${id}`);if(!d){const r=await fetch(`game-data.json?ts=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw new Error('אין חידה מפורסמת');d=await r.json();d.id=d.id||'legacy-current';d.number=d.number||1}initGame(d,false)}await renderArchive()}catch(e){$('subtitle').textContent='';grid.innerHTML=`<div class="error-box">${escapeHtml(e.message)}</div>`}}
$('submitBtn').onclick=submitSelection;$('clearBtn').onclick=()=>{selected=[];setMessage('');render()};$('shuffleBtn').onclick=()=>{remainingWords=shuffleArray(remainingWords);selected=[];setMessage('');render()};$('hintBtn').onclick=()=>{hintUsed=true;selected=hintWords.filter(w=>remainingWords.includes(w));setMessage('שתי המילים המסומנות שייכות לאותה קבוצה.');render()};$('shareBtn').onclick=()=>shareText(true);$('sharePuzzleBtn').onclick=()=>shareText(false);start();
</script>
</body></html>
